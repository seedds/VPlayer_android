name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for the legacy "tools" package, which current
          # cmdline-tools no longer ship, so sdkmanager fails. Gradle fetches the
          # platform and build-tools it needs on its own.
          packages: platform-tools

      - name: Compute release metadata
        id: release_meta
        run: ./scripts/android-release-meta.sh --format=github-output >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vplayer-release.keystore"
            echo "path=$RUNNER_TEMP/vplayer-release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "No release keystore secret set; falling back to the debug key." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          VPLAYER_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          VPLAYER_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          VPLAYER_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          VPLAYER_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          VPLAYER_VERSION_NAME: ${{ steps.release_meta.outputs.app_version }}
          VPLAYER_VERSION_CODE: ${{ steps.release_meta.outputs.build_number }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$src" ]; then echo "No release APK produced" >&2; exit 1; fi
          dest="app/build/outputs/apk/release/${{ steps.release_meta.outputs.apk_name }}"
          if [ "$src" != "$dest" ]; then mv "$src" "$dest"; fi
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(git for-each-ref refs/tags --sort=-creatordate --format='%(refname:short)' \
            | grep -v '^${{ steps.release_meta.outputs.release_tag }}$' | head -1 || true)
          {
            echo "## Changelog"
            echo
            if [ -n "$previous" ]; then
              echo "Changes since \`$previous\`."
              range="$previous..HEAD"
            else
              echo "Changes included in this release."
              range="HEAD"
            fi
            echo
            count=0
            while read -r sha; do
              [ -z "$sha" ] && continue
              count=$((count + 1))
              echo "### \`$(git log -1 --format=%h "$sha")\` $(git log -1 --format=%s "$sha")"
              body=$(git log -1 --format=%b "$sha")
              if [ -n "$body" ]; then echo; echo "$body"; fi
              echo
            done < <(git rev-list --reverse "$range")
            if [ "$count" -eq 0 ]; then echo "Rebuilt release artifacts for this commit."; fi
          } > "$notes"
          echo "notes_path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: VPlayer ${{ steps.release_meta.outputs.app_version }}
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
